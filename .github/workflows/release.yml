name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Package Portable Windows Release
        run: |
          mkdir -p release-pkg
          zip -r release-pkg/storytel-client-windows-portable.zip . -x ".git/*" "node_modules/.cache/*" ".next/cache/*"

      - name: Package Portable Linux / macOS Release
        run: |
          tar -czf release-pkg/storytel-client-linux-macos-portable.tar.gz --exclude='.git' --exclude='node_modules/.cache' --exclude='.next/cache' .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "storytel-client ${{ inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-pkg/storytel-client-windows-portable.zip
            release-pkg/storytel-client-linux-macos-portable.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
